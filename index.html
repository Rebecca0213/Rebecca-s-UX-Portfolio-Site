<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rebecca Szeto — Product Designer & Design Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Grand+Hotel&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Pacifico&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=cafe-panel-tight1" />
    <link rel="stylesheet" href="turntable.css?v=footer" />
    <link rel="stylesheet" href="macaron-town/island.css?v=14" />
    <link rel="stylesheet" href="macaron-town/styles/signs.css?v=1" />
    <!-- Keep in sync with macaron-town/importmap.json (written by scripts/sync-macaron-town.py). -->
    <script type="importmap">
      {
        "imports": {
          "three": "./macaron-town/vendor/three/build/three.module.js",
          "three/examples/jsm/": "./macaron-town/vendor/three/examples/jsm/",
          "three/addons/": "./macaron-town/vendor/three/examples/jsm/",
          "gsap": "./macaron-town/vendor/gsap/index.js"
        }
      }
    </script>
    <link rel="modulepreload" href="macaron-town/vendor/three/build/three.module.js" />
    <link rel="modulepreload" href="macaron-town/vendor/three/build/three.core.js" />
    <script src="case-study-lock.js?v=3"></script>
  </head>
  <body class="page-home is-ready">
    <script>
      (function () {
        if (!document.body.classList.contains("page-home")) return;
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        const openWorks = location.hash === "#works";
        if (location.hash && !openWorks) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        if (!openWorks) {
          window.scrollTo(0, 0);
        }
      })();
    </script>
    <script src="layout.js?v=no-locks1"></script>
    <script>Layout.loader()</script>
    <script>
      document.getElementById("page-loader")?.remove();
      document.body.classList.remove("is-loading");
      document.body.classList.add("is-ready");
    </script>
    <script>Layout.nav()</script>

    <main>
      <section class="hero hero--island">
        <div class="island">
          <div class="island__stage"></div>
          <img
            class="island__poster"
            src="assets/hero/cloud-cream-island.jpg?v=4"
            alt="Cloud Cream Island, a floating pastel town of macaron houses"
            width="3840"
            height="2160"
            fetchpriority="high"
          />
          <div class="island__loader" role="status" aria-live="polite" aria-label="Loading the island">
            <img class="island__loader-macaron" src="assets/hero/loader-macaron.png" alt="" width="540" height="385" />
            <span class="island__loader-track" aria-hidden="true"><span class="island__loader-bar"></span></span>
            <span class="island__loader-label">Loading the island</span>
          </div>
        </div>

        <div class="hero__title-block">
          <h1 class="hero__title">
            Rebecca S<span class="name-z-wrap">
              <span class="accent-z accent-z--interactive" tabindex="0">z</span>
            </span>eto
          </h1>
          <p class="hero__tagline">Product Designer and Builder</p>
          <p class="hero__hint">
            <span>Zoom in</span>
            <span>Click and hold to spin the island</span>
            <span>Hover and click buildings</span>
            <span>(Welcome Centre, Gallery, Café)</span>
          </p>
        </div>

        <span class="hero__scroll-cue" aria-hidden="true">
          <span class="hero__scroll-cue-label">Scroll</span>
          <span class="hero__scroll-cue-line"></span>
        </span>

        <aside class="welcome-panel" id="welcome-panel" aria-hidden="true" aria-label="Page">
          <button type="button" class="welcome-panel__close" aria-label="Close">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M3.2 3.2l9.6 9.6M12.8 3.2l-9.6 9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <div class="welcome-panel__scroll">
            <div class="welcome-panel__pages"></div>
          </div>
        </aside>
      </section>

      <script>Layout.featuredWorks()</script>

      <script>Layout.footer()</script>
    </main>


    <script type="module" src="macaron-town/island.js?v=mobile-memory1"></script>
    <script src="script.js?v=works-nav2"></script>
  </body>
</html>
